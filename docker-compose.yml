services:
  db:
    image: postgres:15-alpine
    container_name: cafeteria-db
    environment:
      POSTGRES_USER: cafeteria_user
      POSTGRES_PASSWORD: cafeteria_password
      POSTGRES_DB: cafeteria_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./API
    container_name: cafeteria-api
    ports:
      - "5001:5001"
    volumes:
      - ./API/instance:/app/instance
    environment:
      SECRET_KEY: dev-secret-key
      JWT_SECRET_KEY: dev-jwt-secret-key
      DATABASE_URL: postgresql://cafeteria_user:cafeteria_password@db:5432/cafeteria_db
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: ./WEB
    container_name: cafeteria-web
    ports:
      - "5000:5000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:

